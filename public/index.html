<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fbf7f0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Bloom">
    <title>Bloom — Daily Puzzles</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" href="/icons/icon.svg">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">🌸</span>
          <span class="brand-name">Bloom</span>
        </div>
        <div class="topdate" id="topDate"></div>
      </header>

      <main class="screen" id="screen" tabindex="-1"></main>

      <nav class="tabbar" aria-label="Sections">
        <button class="tab" data-tab="today" type="button"><span class="tab-ico" aria-hidden="true">✿</span><span>Today</span></button>
        <button class="tab" data-tab="more" type="button"><span class="tab-ico" aria-hidden="true">☷</span><span>More</span></button>
        <button class="tab" data-tab="gallery" type="button"><span class="tab-ico" aria-hidden="true">🖼</span><span>Gallery</span></button>
        <button class="tab" data-tab="settings" type="button"><span class="tab-ico" aria-hidden="true">⚙</span><span>Settings</span></button>
      </nav>
    </div>

    <script src="/art.js"></script>
    <script src="/puzzles.js"></script>
    <script src="/auth.js"></script>
    <script src="/runtime-config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
